# SYNTHETIC TEST DATA — NOT REAL. Loads successfully (schema-valid) but
# essential + lifestyle + discretionary != annual_total, well beyond rounding
# tolerance — used to prove lifestyle.py *reports* the discrepancy rather than
# silently reconciling it (SPEC lifestyle.py row; NOT a profile_load error).
synthetic: true
schema_version: 2
household:
  members:
    - role: adult_1
      age: 40
income:
  sources:
    - label: "job"
      gross_annual: 100000
      stability: stable
spending:
  annual_total: 80000
  essential: 50000
  lifestyle: 20000
  discretionary: 20000   # 50000+20000+20000 = 90000, $10,000 over the stated total
safety_reserve:
  target_months_of_essential: 6
liquid:
  - label: "operating cash"
    approx_value: 20000
    access: immediate
scenarios:
  base:
    equity_return_pct: 7
    fixed_income_return_pct: 4
    inflation_pct: 3
    income_continues: true
    longevity_age: 90
  reasonable_downside:
    equity_return_pct: 4
    fixed_income_return_pct: 3
    inflation_pct: 4
    income_continues: true
    longevity_age: 95
