# =============================================================================
# SYNTHETIC TEST DATA — NOT REAL. DO NOT COPY REAL FIGURES INTO THIS FILE.
# =============================================================================
# Phase 3B-5, Scenario D — Unknown / unclassified.
# Essential spending is UNKNOWN (omitted). Three items deliberately fail
# classification: "misc savings" (declared purpose='oddball', unrecognized),
# "random account" (no purpose, no keyword match), "mystery fund" (investment
# with intended_purpose='somewhere_else', unrecognized). Retirement itself is
# fully specified so the scenario tests exactly one failure mode at a time.
# =============================================================================

synthetic: true
schema_version: 2

household:
  members:
    - role: adult_1
      age: 45
      target_retirement_age: 65

income:
  sources:
    - label: "employment"
      gross_annual: 150000
      stability: stable

spending:
  annual_total: 65000
  lifestyle: 18000
  discretionary: 7000
  # essential deliberately omitted -> Unknown

liquid:
  - label: "operating cash"
    approx_value: 5000
    access: immediate
    purpose: operating
  - label: "misc savings"
    approx_value: 4000
    access: immediate
    purpose: oddball
  - label: "random account"
    approx_value: 3000
    access: immediate

investments:
  - label: "401k"
    approx_value: 800000
    tax_treatment: tax_deferred
    liquidity: penalty_before_age
    intended_purpose: retirement
    allocation:
      equity_pct: 60
      fixed_income_pct: 40
  - label: "mystery fund"
    approx_value: 20000
    tax_treatment: taxable
    liquidity: immediate
    intended_purpose: somewhere_else
    allocation:
      equity_pct: 50
      fixed_income_pct: 50

safety_reserve:
  target_months_of_essential: 3

goals:
  retirement:
    target_age_adult_1: 65
    desired_annual_spending: 60000
    social_security_estimate_annual: 30000
    other_retirement_income: 10000

scenarios:
  base:
    equity_return_pct: 7
    fixed_income_return_pct: 4
    inflation_pct: 3
    income_continues: true
    longevity_age: 90
  reasonable_downside:
    equity_return_pct: 4
    fixed_income_return_pct: 3
    inflation_pct: 4
    income_continues: true
    longevity_age: 95
