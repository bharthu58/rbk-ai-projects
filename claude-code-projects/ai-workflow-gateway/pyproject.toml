[project]
name = "ai-workflow-gateway"
version = "0.1.0"
description = "Local infrastructure bridging Claude Cowork with email and Telegram notifications."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.6",
    "weasyprint>=62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
